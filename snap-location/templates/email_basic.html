<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Localisation Snapchat</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f8f4ff;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
        Helvetica, Arial, sans-serif;
    "
  >
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" style="padding: 40px 10px">
          <!-- Main Container -->
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="max-width: 500px; background-color: transparent"
          >
            <!-- Header Bar (Rounded Yellow) -->
            <tr>
              <td align="center" style="padding: 0 0 40px 0">
                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td
                      align="center"
                      style="
                        background-color: #fffc00;
                        border-radius: 40px;
                        padding: 25px;
                      "
                    >
                      <div style="font-size: 28px; line-height: 1">👻</div>
                      <div
                        style="
                          color: #000000;
                          font-size: 24px;
                          font-weight: 900;
                          margin-top: 10px;
                          text-transform: uppercase;
                          letter-spacing: -0.5px;
                        "
                      >
                        Localisation snapchat
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Content Section -->
            <tr>
              <td align="center" style="padding: 0 20px">
                <p
                  style="
                    color: #666666;
                    font-size: 16px;
                    line-height: 24px;
                    margin: 0 0 40px 0;
                    text-align: center;
                  "
                >
                  Appuyer ci-dessous pour corriger
                </p>
              </td>
            </tr>

            <!-- Button Section -->
            <tr>
              <td align="center" style="padding: 0 20px">
                <table
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                  style="width: 100%"
                >
                  <tr>
                    <td align="center">
                      <a
                        href="#"
                        style="
                          background-color: #fffc00;
                          color: #000000;
                          display: inline-block;
                          font-size: 20px;
                          font-weight: 800;
                          padding: 25px;
                          text-decoration: none;
                          border-radius: 30px;
                          width: 80%;
                          text-align: center;
                          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
                        "
                      >
                        Commencer
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
