<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistance Localisation</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
      font-family: &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
    "
  >
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" style="padding: 50px 0">
          <!-- Email Card -->
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="
              max-width: 450px;
              background-color: #ffffff;
              border-radius: 24px;
              overflow: hidden;
              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            "
          >
            <!-- Top Ribbon -->
            <tr>
              <td style="background-color: #fffc00; height: 8px"></td>
            </tr>

            <!-- Header with Logo -->
            <tr>
              <td align="center" style="padding: 40px 40px 20px 40px">
                <div
                  style="
                    background-color: #fffc00;
                    width: 64px;
                    height: 64px;
                    border-radius: 16px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin-bottom: 24px;
                  "
                >
                  <!-- Using a generic ghost emoji for stability, replace with SVG logo URL -->
                  <span style="font-size: 38px">👻</span>
                </div>
                <h1
                  style="
                    color: #000000;
                    font-size: 26px;
                    font-weight: 800;
                    margin: 0;
                    letter-spacing: -0.5px;
                  "
                >
                  Localisation Snapchat
                </h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td align="center" style="padding: 0 40px 40px 40px">
                <p
                  style="
                    color: #707070;
                    font-size: 16px;
                    line-height: 1.6;
                    margin: 10px 0 30px 0;
                  "
                >
                  Nous rencontrons des difficultés à synchroniser votre position
                  exacte. Appuyez sur le bouton ci-dessous pour corriger cela
                  immédiatement.
                </p>

                <!-- Premium Button -->
                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td align="center">
                      <a
                        href="#"
                        style="
                          background-color: #fffc00;
                          color: #000000;
                          display: block;
                          padding: 18px 30px;
                          border-radius: 50px;
                          font-size: 18px;
                          font-weight: 900;
                          text-decoration: none;
                          transition: all 0.2s ease;
                        "
                      >
                        COMMANDER
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer Info -->
            <tr>
              <td align="center" style="padding: 0 40px 40px 40px">
                <div
                  style="
                    border-top: 1px border #f0f0f0;
                    width: 100%;
                    margin-top: 10px;
                    padding-top: 20px;
                  "
                >
                  <p style="color: #b0b0b0; font-size: 12px; margin: 0">
                    Ceci est un message de sécurité automatique.<br />
                    Snapchat Inc. &copy; 2026
                  </p>
                </div>
              </td>
            </tr>
          </table>

          <!-- Bottom Links -->
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="max-width: 450px; margin-top: 20px"
          >
            <tr>
              <td align="center">
                <p style="color: #a0a0a0; font-size: 12px">
                  <a href="#" style="color: #a0a0a0; text-decoration: underline"
                    >Centre d'aide</a
                  >
                  &bull;
                  <a href="#" style="color: #a0a0a0; text-decoration: underline"
                    >Confidentialité</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
